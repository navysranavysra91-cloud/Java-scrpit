<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="shortcut icon" href="download.png" type="image/x-icon">
    <link rel="stylesheet" href="snake.css">
</head>
<body>
    <div class="container">
        <main>
            <div class="nav">
             <span>High Score<div class="screen-btn high-score">0</div></span>   
              <span>Score<div class="screen-btn score">0</div></span>  
              <span>Time<div class="screen-btn time">00:00</div></span> 
            </div>
            <div class="display">
                
            </div>
            <div class="btn-container">
                <div class="start">
                    <h2>Welcome to Snake Game</h2>
                    <button class="start-btn btn">Start</button>
                </div>
                <div class="game-over">
                    <h2>Game Over</h2>
                    <button class="restart-btn btn">Restart</button>
                </div>
            </div>
        </main>
    </div>
    <script src="snake.js"></script>
</body>
</html>
